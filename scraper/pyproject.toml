[project]
name = "roteamento-scraper"
version = "0.1.0"
description = "Scraper do CGE-SP (Alagamentos) para o Roteamento Resiliente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
cge-scraper = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
