name: roteamento-resiliente

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla
    ports:
      - "8002:8002"
    volumes:
      - ../data:/data
    command: valhalla_service /data/valhalla.json 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - roteamento

  backend:
    build: ../backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roteamento}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em runtime/.env}@postgis:5432/${POSTGRES_DB:-roteamento}
      VALHALLA_URL: http://valhalla:8002
      NOMINATIM_URL: http://nominatim:8080
      ERMAC_Q: "2.0"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      HOTSPOTS_CSV: /data/traffic_report/affected_edges.csv
    volumes:
      # so-leitura: backend serve os hotspots historicos de affected_edges.csv
      - ../data:/data:ro
    depends_on:
      valhalla:
        condition: service_healthy
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - roteamento

  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      # A 80/443 ficam com o Caddy (HTTPS). O frontend fica interno; a 3000
      # segue publicada como acesso direto de emergencia (HTTP).
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (nao localhost): nginx escuta so IPv4; localhost resolve ::1 -> refused
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - roteamento

  # Caddy: porta de entrada com HTTPS automatico (Let's Encrypt). Serve o site em
  # https://$SITE_ADDRESS (portas 80/443) e repassa para o frontend interno.
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?defina SITE_ADDRESS em runtime/.env, ex roteamento.duckdns.org}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - roteamento

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roteamento}
      POSTGRES_USER: ${POSTGRES_USER:-roteamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em runtime/.env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-roteamento} -d $${POSTGRES_DB:-roteamento}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - roteamento

  # Scraper do CGE-SP em modo BATCH (uma passada e sai). Atras de profile — dispare
  # manualmente quando quiser uma coleta pontual:
  #   docker compose --profile scraper run --rm scraper run --once [--dry-run] [--date dd/mm/YYYY]
  scraper:
    build: ../scraper
    container_name: scraper
    profiles: ["scraper"]
    environment:
      BACKEND_URL: http://backend:8000
      CGE_URL: https://www.cgesp.org/v3/alagamentos.jsp
      LOG_LEVEL: INFO
      HEADLESS: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - roteamento

  # Worker real-time: roda o scraper em LOOP com cadencia adaptativa (Etapa 6).
  # Sobe junto com a stack e se mantem rodando (restart: unless-stopped).
  # Cadencia/limites configuraveis por env (ver scraper/app/config.py).
  scraper-worker:
    build: ../scraper
    container_name: scraper-worker
    command: ["run", "--loop"]
    environment:
      BACKEND_URL: http://backend:8000
      CGE_URL: https://www.cgesp.org/v3/alagamentos.jsp
      LOG_LEVEL: INFO
      HEADLESS: "true"
    depends_on:
      backend:
        condition: service_healthy
      nominatim:
        condition: service_healthy
    healthcheck:
      # heartbeat escrito a cada ciclo bem-sucedido; unhealthy se parar de atualizar
      # por >25 min (cobre o intervalo maximo de 15 min + folga)
      test: ["CMD-SHELL", "python -c \"import time,sys; t=float(open('/tmp/scraper_heartbeat').read()); sys.exit(0 if time.time()-t < 1500 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - roteamento

  # Nominatim sobe junto com a stack (o scraper-worker depende dele pra geocodar).
  # Recorte da RMSP: import inicial ~3 min, ~4 GB de disco. Para NAO subir o
  # geocoder (stack minima), use: docker compose up -d valhalla postgis backend frontend
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim
    ports:
      - "8080:8080"
    environment:
      # PBF montado FORA de /nominatim/ para escapar do `chown -R /nominatim`
      # que o init.sh roda — falha em mount read-only e derruba o container.
      PBF_PATH: /pbf/sao-paulo.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?defina NOMINATIM_PASSWORD em runtime/.env}
      IMPORT_STYLE: address
    shm_size: 1g
    volumes:
      - ../data/sao-paulo.osm.pbf:/pbf/sao-paulo.osm.pbf:ro
      - nominatim_data:/var/lib/postgresql/14/main
      # SEM flatnode: a imagem so ativa o flatnode file se existir o dir
      # /nominatim/flatnode (config.sh). Para extrato pequeno (RMSP) vale mais
      # guardar os nos no Postgres — o flatnode e fixo em ~110 GB (dimensionado
      # pelo maior node ID global do OSM, nao pelo recorte). Ver 07-quirks.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - roteamento

volumes:
  postgis_data:
  nominatim_data:
  caddy_data:
  caddy_config:

networks:
  roteamento:
    driver: bridge
